id: app.mysql
name: MySQL / MariaDB
class: app
summary: Relational database. Connections, replication lag and slow queries dominate.
aliases:
- mysql
- mariadb
- percona-server
chartNames:
- mysql
- mariadb
- percona-xtradb-cluster
- mysql-operator
labels:
  app.kubernetes.io/name: mysql
images:
- mysql
- mariadb
- percona/percona-server
metrics:
- name: mysql_up
  type: gauge
- name: mysql_global_status_threads_connected
  type: gauge
  query: mysql_global_status_threads_connected / mysql_global_variables_max_connections
- name: mysql_global_variables_max_connections
  type: gauge
- name: mysql_slave_status_seconds_behind_master
  type: gauge
  means: Replication lag. Reads from a lagging replica return stale data with no error.
- name: mysql_global_status_slow_queries
  type: counter
- name: mysql_global_status_innodb_row_lock_time_avg
  type: gauge
